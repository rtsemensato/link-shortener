name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkshortener
          POSTGRES_PASSWORD: linkshortener_dev
          POSTGRES_DB: linkshortener_test
        ports:
          - "5434:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # test/setup-env.ts carrega .env.test (comitado) com o DATABASE_URL
      # abaixo, que já bate com o service container acima.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://linkshortener:linkshortener_dev@localhost:5434/linkshortener_test?schema=public"
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
